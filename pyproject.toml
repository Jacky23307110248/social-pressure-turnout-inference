[project]
name = "social-pressure-turnout-inference"
version = "1.0.0"
description = "Design-aware reanalysis of a household-randomized voter-turnout field experiment"
requires-python = ">=3.13"
dependencies = [
  "numpy==2.2.5",
  "pandas==2.3.2",
  "scipy==1.15.2",
  "matplotlib==3.10.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

